<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Genesys Customer Disconnect Monitor</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        .card {
            border: 1px solid #e0e0e0;
            padding: 20px;
            width: 420px;
            border-radius: 8px;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-top: 20px;
        }

        .card h3 {
            margin-top: 0;
        }

        .card p {
            margin: 10px 0;
            font-size: 14px;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .value {
            color: #0066cc;
            font-weight: 600;
            word-break: break-all;
        }

        .active {
            color: green !important;
        }

        .ended {
            color: red !important;
        }

        .match {
            color: green !important;
            font-weight: bold;
        }

        .mismatch {
            color: red !important;
            font-weight: bold;
        }

        .beep {
            color: green !important;
            font-weight: bold;
        }

        .waiting {
            color: #777 !important;
        }

        .audio-button {
            margin-top: 15px;
            padding: 10px 18px;
            font-size: 14px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .audio-button:hover {
            background-color: #004999;
        }

        .log-box {
            margin-top: 20px;
            width: 420px;
            background: #111;
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            height: 180px;
            overflow-y: auto;
        }

    </style>

</head>


<body>

    <h1>
        Genesys Call Monitor
    </h1>

    <p>
        Customer Disconnect Beep Monitor
    </p>


    <!-- =====================================================
         CALL DETAILS
    ====================================================== -->

    <div class="card">

        <h3>
            Live Call Details
        </h3>


        <p>

            <span class="label">
                Call State:
            </span>

            <span
                id="call-state"
                class="value waiting">

                Waiting

            </span>

        </p>


        <p>

            <span class="label">
                Conversation ID:
            </span>

            <span
                id="conversation-id"
                class="value">

                Waiting...

            </span>

        </p>


        <p>

            <span class="label">
                Lambda Status:
            </span>

            <span
                id="lambda-status"
                class="value waiting">

                Not Connected

            </span>

        </p>


        <p>

            <span class="label">
                Lambda Conversation ID:
            </span>

            <span
                id="lambda-conversation-id"
                class="value">

                -

            </span>

        </p>


        <p>

            <span class="label">
                ID Comparison:
            </span>

            <span
                id="comparison-status"
                class="value waiting">

                Waiting

            </span>

        </p>


        <p>

            <span class="label">
                Beep Status:
            </span>

            <span
                id="beep-status"
                class="value waiting">

                Not Played

            </span>

        </p>


        <button
            id="audio-button"
            class="audio-button"
            onclick="enableAudio()">

            Enable Audio

        </button>

    </div>


    <!-- =====================================================
         DEBUG LOG
    ====================================================== -->

    <div
        id="debug-log"
        class="log-box">

        Starting monitor...

    </div>


<script>


/* =========================================================
   CONFIGURATION
========================================================= */

const LAMBDA_URL =
    "https://v4gejir3ejrwwlnyibcx4a7uiq0kljsw.lambda-url.us-east-1.on.aws/";


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentConversationId = null;

let lastBeepedConversationId = null;

let audioContext = null;

let pollingInProgress = false;


/* =========================================================
   DEBUG LOGGER
========================================================= */

function debugLog(message) {

    console.log(message);

    const log =
        document.getElementById("debug-log");

    const time =
        new Date().toLocaleTimeString();

    log.innerHTML +=
        `<div>[${time}] ${message}</div>`;

    log.scrollTop =
        log.scrollHeight;

}


/* =========================================================
   GET CONVERSATION ID FROM URL
========================================================= */

function getConversationIdFromURL() {

    try {

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const conversationId =
            urlParams.get("conversationId");


        if (!conversationId) {

            debugLog(
                "❌ conversationId parameter not found in URL"
            );

            return null;

        }


        /*
         * Decode URL value
         */

        const decodedId =
            decodeURIComponent(
                conversationId
            ).trim();


        debugLog(
            "Conversation ID received from URL: " +
            decodedId
        );


        return decodedId;

    }

    catch (error) {

        debugLog(
            "Error reading conversation ID: " +
            error.message
        );

        return null;

    }

}


/* =========================================================
   INITIALIZE CONVERSATION
========================================================= */

function initializeConversation() {

    currentConversationId =
        getConversationIdFromURL();


    if (!currentConversationId) {

        document.getElementById(
            "conversation-id"
        ).innerText =
            "Not Available";


        document.getElementById(
            "call-state"
        ).innerText =
            "No Conversation ID";


        debugLog(
            "⚠️ No conversation ID received."
        );


        return;

    }


    /*
     * Display conversation ID
     */

    document.getElementById(
        "conversation-id"
    ).innerText =
        currentConversationId;


    /*
     * Display active state
     */

    document.getElementById(
        "call-state"
    ).innerText =
        "Active";


    document.getElementById(
        "call-state"
    ).className =
        "value active";


    debugLog(
        "✅ Active Genesys Conversation ID: " +
        currentConversationId
    );


    /*
     * Display complete URL
     * for troubleshooting
     */

    debugLog(
        "Current URL: " +
        window.location.href
    );

}


/* =========================================================
   AUDIO INITIALIZATION
========================================================= */

async function enableAudio() {

    try {

        /*
         * Create AudioContext
         */

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        /*
         * Resume AudioContext
         */

        if (
            audioContext.state ===
            "suspended"
        ) {

            await audioContext.resume();

        }


        debugLog(
            "AudioContext state: " +
            audioContext.state
        );


        /*
         * Update button
         */

        document.getElementById(
            "audio-button"
        ).innerText =
            "Audio Enabled";


        document.getElementById(
            "beep-status"
        ).innerText =
            "Audio Ready";


        document.getElementById(
            "beep-status"
        ).className =
            "value beep";


        /*
         * Test beep
         */

        playTestBeep();


    }

    catch (error) {

        debugLog(
            "❌ Audio initialization error: " +
            error.message
        );

    }

}


/* =========================================================
   TEST BEEP
========================================================= */

function playTestBeep() {

    if (!audioContext) {

        return;

    }


    try {

        const oscillator =
            audioContext.createOscillator();


        const gainNode =
            audioContext.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            800;


        gainNode.gain.value =
            0.2;


        oscillator.connect(
            gainNode
        );


        gainNode.connect(
            audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime + 0.15
        );


        debugLog(
            "🔊 Audio test beep played"
        );

    }

    catch (error) {

        debugLog(
            "Test beep error: " +
            error.message
        );

    }

}


/* =========================================================
   CUSTOMER DISCONNECT BEEP
========================================================= */

async function playDisconnectBeep() {

    debugLog(
        "🔔 Attempting customer disconnect beep..."
    );


    try {

        /*
         * Create AudioContext if required
         */

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        /*
         * Resume context
         */

        if (
            audioContext.state ===
            "suspended"
        ) {

            await audioContext.resume();

        }


        /*
         * Make sure audio is running
         */

        if (
            audioContext.state !==
            "running"
        ) {

            throw new Error(
                "AudioContext is not running"
            );

        }


        /*
         * Create oscillator
         */

        const oscillator =
            audioContext.createOscillator();


        const gainNode =
            audioContext.createGain();


        /*
         * Beep frequency
         */

        oscillator.type =
            "sine";


        oscillator.frequency.value =
            1000;


        /*
         * Volume

         */

        gainNode.gain.setValueAtTime(
            0.5,
            audioContext.currentTime
        );


        /*
         * Connect audio nodes
         */

        oscillator.connect(
            gainNode
        );


        gainNode.connect(
            audioContext.destination
        );


        /*
         * Play beep

         */

        oscillator.start();


        oscillator.stop(
            audioContext.currentTime + 0.5
        );


        /*
         * Update UI

         */

        document.getElementById(
            "beep-status"
        ).innerText =
            "🔔 BEEP PLAYED";


        document.getElementById(
            "beep-status"
        ).className =
            "value beep";


        document.getElementById(
            "call-state"
        ).innerText =
            "Customer Disconnected";


        document.getElementById(
            "call-state"
        ).className =
            "value ended";


        debugLog(
            "🔔 CUSTOMER DISCONNECTED - BEEP PLAYED"
        );

    }

    catch (error) {

        document.getElementById(
            "beep-status"
        ).innerText =
            "Beep Error";


        debugLog(
            "❌ Beep error: " +
            error.message
        );

    }

}


/* =========================================================
   POLL LAMBDA
========================================================= */

async function pollLambda() {

    /*
     * Don't poll without conversation ID
     */

    if (!currentConversationId) {

        return;

    }


    /*
     * Prevent overlapping requests
     */

    if (pollingInProgress) {

        return;

    }


    pollingInProgress = true;


    try {

        debugLog(
            "Polling Lambda..."
        );


        const response =
            await fetch(
                LAMBDA_URL,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         * Lambda connected
         */

        document.getElementById(
            "lambda-status"
        ).innerText =
            "Connected";


        document.getElementById(
            "lambda-status"
        ).className =
            "value active";


        /*
         * No event yet
         */

        if (
            !data.event ||
            !data.conversationId
        ) {

            document.getElementById(
                "lambda-conversation-id"
            ).innerText =
                "-";


            document.getElementById(
                "comparison-status"
            ).innerText =
                "Waiting for event";


            document.getElementById(
                "comparison-status"
            ).className =
                "value waiting";


            pollingInProgress = false;

            return;

        }


        /*
         * Display Lambda ID
         */

        document.getElementById(
            "lambda-conversation-id"
        ).innerText =
            data.conversationId;


        debugLog(
            "Lambda Event: " +
            data.event
        );


        debugLog(
            "Lambda Conversation ID: " +
            data.conversationId
        );


        /*
         * Only process customer disconnect
         */

        if (
            data.event !==
            "CUSTOMER_DISCONNECTED"
        ) {

            pollingInProgress = false;

            return;

        }


        /*
         * Normalize both IDs
         */

        const genesysId =
            String(
                currentConversationId
            )
            .trim()
            .toLowerCase();


        const lambdaId =
            String(
                data.conversationId
            )
            .trim()
            .toLowerCase();


        debugLog(
            "Genesys ID: " +
            genesysId
        );


        debugLog(
            "Lambda ID: " +
            lambdaId
        );


        /*
         * Compare IDs
         */

        if (
            genesysId === lambdaId
        ) {

            /*
             * MATCH
             */

            document.getElementById(
                "comparison-status"
            ).innerText =
                "✅ MATCH";


            document.getElementById(
                "comparison-status"
            ).className =
                "value match";


            debugLog(
                "✅ CONVERSATION ID MATCH"
            );


            /*
             * Prevent duplicate beep
             */

            if (
                lastBeepedConversationId ===
                lambdaId
            ) {

                debugLog(
                    "Beep already played for this conversation."
                );


                pollingInProgress = false;

                return;

            }


            /*
             * Save ID

             */

            lastBeepedConversationId =
                lambdaId;


            /*
             * Play beep

             */

            await playDisconnectBeep();

        }

        else {

            /*
             * MISMATCH
             */

            document.getElementById(
                "comparison-status"
            ).innerText =
                "❌ MISMATCH";


            document.getElementById(
                "comparison-status"
            ).className =
                "value mismatch";


            debugLog(
                "❌ CONVERSATION ID MISMATCH"
            );

        }

    }

    catch (error) {

        document.getElementById(
            "lambda-status"
        ).innerText =
            "Error";


        document.getElementById(
            "lambda-status"
        ).className =
            "value ended";


        debugLog(
            "❌ Lambda error: " +
            error.message
        );

    }


    pollingInProgress = false;

}


/* =========================================================
   START POLLING
========================================================= */

setInterval(
    pollLambda,
    1000
);


/* =========================================================
   INITIALIZATION
========================================================= */

debugLog(
    "Genesys Call Monitor initialized."
);


initializeConversation();


debugLog(
    "Waiting for customer disconnect event..."
);

</script>

</body>

</html>
