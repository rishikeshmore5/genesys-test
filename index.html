<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Genesys Customer Disconnect Monitor</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }

        .card {
            width: 420px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-top: 0;
        }

        .row {
            margin: 12px 0;
            font-size: 14px;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .value {
            color: #0066cc;
            font-weight: bold;
            word-break: break-all;
        }

        .connected {
            color: green;
        }

        .disconnected {
            color: red;
        }

        .match {
            color: green;
            font-weight: bold;
        }

        .mismatch {
            color: red;
            font-weight: bold;
        }

        .beep {
            color: green;
            font-size: 18px;
            font-weight: bold;
        }

        .log {
            margin-top: 20px;
            width: 420px;
            height: 180px;
            overflow-y: auto;
            background: #111;
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
        }

        .enable-audio {
            margin-top: 15px;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background: #0066cc;
            color: white;
            cursor: pointer;
        }

    </style>

</head>


<body>

    <div class="card">

        <h3>Live Call Monitor</h3>

        <div class="row">
            <span class="label">
                Call State:
            </span>

            <span id="call-state"
                  class="value">
                Waiting
            </span>
        </div>


        <div class="row">

            <span class="label">
                Conversation ID:
            </span>

            <span id="conversation-id"
                  class="value">
                Waiting...
            </span>

        </div>


        <div class="row">

            <span class="label">
                Lambda Status:
            </span>

            <span id="lambda-status"
                  class="value">
                Not Connected
            </span>

        </div>


        <div class="row">

            <span class="label">
                Lambda Conversation ID:
            </span>

            <span id="lambda-conversation-id"
                  class="value">
                -
            </span>

        </div>


        <div class="row">

            <span class="label">
                ID Comparison:
            </span>

            <span id="comparison"
                  class="value">
                Waiting
            </span>

        </div>


        <div class="row">

            <span class="label">
                Beep Status:
            </span>

            <span id="beep-status"
                  class="value">
                Not Played
            </span>

        </div>


        <button
            class="enable-audio"
            onclick="enableAudio()">

            Enable Audio

        </button>

    </div>


    <div
        id="log"
        class="log">

        Starting monitor...

    </div>


<script>


/* =========================================================
   CONFIGURATION
========================================================= */

const LAMBDA_URL =
    "https://v4gejir3ejrwwlnyibcx4a7uiq0kljsw.lambda-url.us-east-1.on.aws/";


/*
 * IMPORTANT
 *
 * This value should be populated from the
 * Genesys Script input variable.
 *
 * If your Script HTML/page supports variable
 * interpolation, replace the value below with:
 *
 * {{ConversationId}}
 *
 */

let currentConversationId = "{{ConversationId}}";


let lastBeepedConversationId = null;

let audioContext = null;


/* =========================================================
   LOGGING
========================================================= */

function log(message) {

    console.log(message);

    const logBox =
        document.getElementById("log");

    const time =
        new Date().toLocaleTimeString();

    logBox.innerHTML +=
        `<div>[${time}] ${message}</div>`;

    logBox.scrollTop =
        logBox.scrollHeight;
}


/* =========================================================
   DISPLAY CONVERSATION ID
========================================================= */

function initializeConversation() {

    /*
     * Remove whitespace
     */

    currentConversationId =
        String(currentConversationId || "").trim();


    /*
     * Check if variable was actually populated
     */

    if (
        !currentConversationId ||
        currentConversationId === "{{ConversationId}}"
    ) {

        log(
            "Conversation ID has not been populated."
        );

        document.getElementById(
            "conversation-id"
        ).innerText =
            "Not Available";

        return;

    }


    document.getElementById(
        "conversation-id"
    ).innerText =
        currentConversationId;


    document.getElementById(
        "call-state"
    ).innerText =
        "Active";


    document.getElementById(
        "call-state"
    ).className =
        "value connected";


    log(
        "Active Conversation ID: " +
        currentConversationId
    );

}


/* =========================================================
   AUDIO INITIALIZATION
========================================================= */

function enableAudio() {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }


        log(
            "Audio enabled. State: " +
            audioContext.state
        );


        document.getElementById(
            "beep-status"
        ).innerText =
            "Audio Enabled";

    }

    catch (error) {

        log(
            "Audio initialization error: " +
            error.message
        );

    }

}


/* =========================================================
   PLAY BEEP
========================================================= */

async function playDisconnectBeep() {

    log(
        "Attempting to play disconnect beep..."
    );


    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if (
            audioContext.state ===
            "suspended"
        ) {

            await audioContext.resume();

        }


        /*
         * First beep
         */

        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            1000;


        gain.gain.setValueAtTime(
            0.5,
            audioContext.currentTime
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime + 0.4
        );


        document.getElementById(
            "beep-status"
        ).innerText =
            "🔔 Beep Played";


        document.getElementById(
            "beep-status"
        ).className =
            "value beep";


        log(
            "🔔 CUSTOMER DISCONNECTED - BEEP PLAYED"
        );

    }

    catch (error) {

        document.getElementById(
            "beep-status"
        ).innerText =
            "Beep Error";


        log(
            "Beep error: " +
            error.message
        );

    }

}


/* =========================================================
   POLL LAMBDA
========================================================= */

async function pollLambda() {

    /*
     * Do not poll until we know
     * which conversation belongs
     * to this script.
     */

    if (
        !currentConversationId ||
        currentConversationId ===
        "{{ConversationId}}"
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                LAMBDA_URL,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        document.getElementById(
            "lambda-status"
        ).innerText =
            "Connected";


        document.getElementById(
            "lambda-conversation-id"
        ).innerText =
            data.conversationId || "-";


        /*
         * No Lambda event
         */

        if (
            !data.event ||
            !data.conversationId
        ) {

            document.getElementById(
                "comparison"
            ).innerText =
                "Waiting for event";

            return;

        }


        /*
         * Only process customer disconnect
         */

        if (
            data.event !==
            "CUSTOMER_DISCONNECTED"
        ) {

            return;

        }


        /*
         * Normalize IDs
         */

        const localId =
            String(
                currentConversationId
            ).trim()
            .toLowerCase();


        const lambdaId =
            String(
                data.conversationId
            ).trim()
            .toLowerCase();


        log(
            "Local ID: " +
            localId
        );


        log(
            "Lambda ID: " +
            lambdaId
        );


        /*
         * COMPARE
         */

        if (
            localId === lambdaId
        ) {

            document.getElementById(
                "comparison"
            ).innerText =
                "✅ MATCH";


            document.getElementById(
                "comparison"
            ).className =
                "value match";


            log(
                "✅ Conversation ID MATCH"
            );


            /*
             * Prevent duplicate beep
             */

            if (
                lastBeepedConversationId ===
                lambdaId
            ) {

                log(
                    "Beep already played for this conversation."
                );

                return;

            }


            lastBeepedConversationId =
                lambdaId;


            /*
             * Play beep
             */

            await playDisconnectBeep();


            /*
             * Update call state
             */

            document.getElementById(
                "call-state"
            ).innerText =
                "Customer Disconnected";


            document.getElementById(
                "call-state"
            ).className =
                "value disconnected";

        }

        else {

            document.getElementById(
                "comparison"
            ).innerText =
                "❌ MISMATCH";


            document.getElementById(
                "comparison"
            ).className =
                "value mismatch";


            log(
                "❌ Conversation ID mismatch"
            );

        }

    }

    catch (error) {

        document.getElementById(
            "lambda-status"
        ).innerText =
            "Error";


        log(
            "Lambda error: " +
            error.message
        );

    }

}


/* =========================================================
   START POLLING
========================================================= */

setInterval(
    pollLambda,
    1000
);


/* =========================================================
   INITIALIZATION
========================================================= */

initializeConversation();

log(
    "Monitor initialized."
);

log(
    "Waiting for customer disconnect event..."
);

</script>

</body>

</html>
